name: INC051 assemble checked Card 3 candidate
on:
  push:
    branches:
      - fix/inc051-card3-source-of-truth
    paths:
      - 'ci/inc051_chunks/**'
      - '.github/workflows/inc051-assemble.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify exact candidate bytes
        shell: bash
        run: |
          test "$(find ci/inc051_chunks -maxdepth 1 -name 'part_*.txt' -type f | wc -l)" -eq 22
          cat ci/inc051_chunks/part_*.txt > the_lab_app.py
          test "$(git hash-object the_lab_app.py)" = "5bf59916512d3a0c0b13d4f86d9a5f672ac7b3f0"
          echo "1bff80c9352e67bd75ae24a1155e927e2bb11019820c7877d75ae1606cb81439  the_lab_app.py" | sha256sum -c -
          python -m py_compile the_lab_app.py
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check Jinja2 requests
      - name: Run Card 3 source-of-truth regression gate
        run: python qa/INC051_release_gate.py
      - name: Commit only validated final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the_lab_app.py
          git rm -r ci/inc051_chunks
          git commit -m "fix(inc051): install Card 3 canonical prescription and safety firewall"
          git push origin HEAD:fix/inc051-card3-source-of-truth
