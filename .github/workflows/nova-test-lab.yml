name: NOVA Test Lab (isolated; private Neon fixture read-only)

on:
  push:
    branches:
      - fix/neon-report-egress-r196999
    paths:
      - .github/workflows/nova-test-lab.yml
      - qa/nova_test_lab/**
      - the_lab_app.py
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-test-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-and-flask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      PRODUCT_SECURITY_STRICT: "0"
      SESSION_COOKIE_SECURE: "0"
      ICU_API_KEY: ""
      ICU_ATHLETE_ID: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
      THE_LAB_TEST_LAB_MODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install actual app dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Assert zero production integrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          assert not os.environ.get("DATABASE_URL")
          assert not os.environ.get("THE_LAB_OWNER_DATABASE_URL")
          assert not os.environ.get("ICU_API_KEY")
          assert not os.environ.get("THE_LAB_PLATFORM_AI_API_KEY")
          print("ISOLATION PASS: no Neon, Intervals.icu or AI credentials")
          PY

      - name: Verify or assemble byte-identical R141 candidate (fail closed)
        run: |
          python qa/nova_test_lab/apply_inc121.py
          echo "27ff5e828b848d2341c556b0357f496943e6c54a9c2b196eceb2c52f73a2e42c  the_lab_app.py" | sha256sum -c -
          python -m py_compile the_lab_app.py

      - name: Real Flask and scientific regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s qa/nova_test_lab -p "test_*.py" -v 2>&1 | tee nova-lab-results.txt

      - name: INC109 full producer to issuer synthetic diagnostic (fail closed)
        run: python qa/nova_test_lab/run_inc109_full_pipeline.py

      - name: Keep sanitized test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-lab-log-${{ github.run_id }}
          path: nova-lab-results.txt
          retention-days: 7
          if-no-files-found: warn

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      PRODUCT_SECURITY_STRICT: "0"
      SESSION_COOKIE_SECURE: "0"
      ICU_API_KEY: ""
      ICU_ATHLETE_ID: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
      THE_LAB_TEST_LAB_MODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout isolated lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install real NOVA and Chromium browser dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Verify or assemble byte-identical R141 candidate (fail closed)
        run: |
          python qa/nova_test_lab/apply_inc121.py
          echo "27ff5e828b848d2341c556b0357f496943e6c54a9c2b196eceb2c52f73a2e42c  the_lab_app.py" | sha256sum -c -
          python -m py_compile the_lab_app.py

      - name: Browser suite against real Flask synthetic Preview
        shell: bash
        run: |
          python qa/nova_test_lab/run_ui_browser.py \
            --mode preview \
            --json ui-audit.json \
            --screenshots ui-synthetic-screenshots

      - name: Browser synthetic 5x3 vs rejected 2x7 quality + fueling
        shell: bash
        run: |
          python qa/nova_test_lab/run_ui_browser.py \
            --mode synthetic_quality \
            --json ui-quality-audit.json

      - name: Real Chromium staging login and signed cookie (synthetic only)
        run: python qa/nova_test_lab/run_browser_authenticated_inc105.py

      - name: Editorial reference approval gate (honest NOT_VERIFIED)
        run: python qa/nova_test_lab/run_visual_diff_inc105.py --mode preview --width 390

      - name: INC107 synthetic owner editorial approval pack
        run: python qa/nova_test_lab/run_inc107_editorial_review.py --out inc107-ui-review

      - name: Publish non-personal UI verdict and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-ui-synthetic-${{ github.run_id }}
          path: |
            ui-audit.json
            ui-quality-audit.json
            ui-synthetic-screenshots/
            inc107-ui-review/
          retention-days: 3
          if-no-files-found: warn

  materialize-exact-r139-on-official-lab:
    name: Materialize tested R141 on the existing authorized LAB branch
    runs-on: ubuntu-latest
    needs:
      - scientific-and-flask
      - browser-ui
      - personal-r136-private-gate
    if: github.ref == 'refs/heads/fix/neon-report-egress-r196999'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout same authorized test branch with write permission
        uses: actions/checkout@v4
        with:
          ref: fix/neon-report-egress-r196999
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert exact triggering head (prevent concurrent overwrite)
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build byte-identical complete R141 in checkout
        shell: bash
        run: |
          set -euo pipefail
          python qa/nova_test_lab/apply_inc121.py
          echo "27ff5e828b848d2341c556b0357f496943e6c54a9c2b196eceb2c52f73a2e42c  the_lab_app.py" | sha256sum -c -
          python -m py_compile the_lab_app.py
      - name: Commit only the Python on LAB, never main or a new branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- the_lab_app.py
          if git diff --cached --quiet; then
            echo "Exact R141 is already committed on the official LAB branch"
          else
            git commit -m "test(lab): materialize CI-verified NOVA R196.9.140"
            git push origin HEAD:refs/heads/fix/neon-report-egress-r196999
          fi
      - name: Confirm remote branch contains the exact R141
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/neon-report-egress-r196999
          git show FETCH_HEAD:the_lab_app.py | sha256sum | grep -F "27ff5e828b848d2341c556b0357f496943e6c54a9c2b196eceb2c52f73a2e42c"

  personal-r136-private-gate:
    name: Personal POWER_5 R136 to exact R139 private replay (REQUIRED)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/fix/neon-report-egress-r196999'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      ICU_API_KEY: ""
      ICU_ATHLETE_ID: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
      THE_LAB_TEST_LAB_MODE: "1"
      NOVA_TEST_LAB_DATABASE_URL: ${{ secrets.NOVA_TEST_LAB_DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout official TEST branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Compile R141 owner replay runner before private credential gate
        run: python -m py_compile qa/nova_test_lab/run_personal_r136_r139_replay.py
      - name: Assert private read-only Neon LAB secret (fail closed)
        shell: bash
        run: |
          if [[ -z "${NOVA_TEST_LAB_DATABASE_URL}" ]]; then
            echo "::error::BLOCKED_PRIVATE_GATE: set NOVA_TEST_LAB_DATABASE_URL as an Actions repository secret for the read-only role nova_r139_qa_reader on NOVA SCIENCE TEST LAB; production is NO-GO."
            exit 2
          fi
      - name: Install real application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify byte-identical R141 and run owner POWER_5 replay (no output files)
        shell: bash
        run: |
          set -euo pipefail
          python qa/nova_test_lab/apply_inc121.py
          echo "27ff5e828b848d2341c556b0357f496943e6c54a9c2b196eceb2c52f73a2e42c  the_lab_app.py" | sha256sum -c -
          python qa/nova_test_lab/run_personal_r136_r139_replay.py
