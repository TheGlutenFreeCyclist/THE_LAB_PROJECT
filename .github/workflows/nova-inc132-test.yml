name: INC132 isolated scientific scaffold and rendering contract (TEST only)

on:
  push:
    branches:
      - fix/neon-report-egress-r196999
    paths:
      - .github/workflows/nova-inc132-test.yml
      - qa/nova_test_lab/inc132_*
      - qa/nova_test_lab/test_inc132_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inc132-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inc132-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      THE_LAB_TEST_LAB_MODE: "1"
      ICU_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
    steps:
      - name: Checkout the authorized TEST branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fail closed if application baseline changed under QA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object the_lab_app.py)" = "ca07e9f135328c5c7e4aa1c4a5be9711a53cd714"
          python -m py_compile the_lab_app.py
          python - <<'PY'
          import os
          for key in ("DATABASE_URL","THE_LAB_OWNER_DATABASE_URL","ICU_API_KEY","ANTHROPIC_API_KEY",
                      "THE_LAB_STANDARD_AI_API_KEY","THE_LAB_PLATFORM_AI_API_KEY"):
              assert not os.environ.get(key), "NON-ISOLATED ENV: "+key
          print("INC132 ISOLATION PASS / APP SOURCE EXACT R150")
          PY

      - name: Execute INC132-only synthetic tests
        run: python -m unittest discover -s qa/nova_test_lab -p 'test_inc132*.py' -v

      - name: Maintain explicit release distinction
        run: |
          echo "PASS = only INC132 synthetic schema and catalog screening."
          echo "NOT VERIFIED = authenticated owner/issuer/real dose/browser/Neon and Q01-Q24; inert Flask smoke is separate."
          echo "R141 legacy workflow is not superseded by this QA workflow."
          echo "PRODUCTION NO-GO."

  flask-boot-inert:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      THE_LAB_TEST_LAB_MODE: "1"
      PRODUCT_SECURITY_STRICT: "0"
      SESSION_COOKIE_SECURE: "0"
      ICU_API_KEY: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
    steps:
      - name: Checkout isolated TEST source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install actual app dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Import real Flask application without live integrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          for key in ("DATABASE_URL","THE_LAB_OWNER_DATABASE_URL","ICU_API_KEY","GARMIN_EMAIL","GARMIN_PASSWORD","ANTHROPIC_API_KEY","THE_LAB_STANDARD_AI_API_KEY","THE_LAB_PLATFORM_AI_API_KEY"):
              assert os.getenv(key,"")=="", key
          import the_lab_app as runtime
          runtime.app.jinja_env.parse(runtime.HOME_PAGE)
          with runtime.app.test_client() as c:
              response=c.get("/healthz")
              assert response.status_code==204, response.status_code
              assert response.headers.get("Cache-Control")=="no-store, max-age=0"
          print("INC132 TEST Flask import, Jinja and inert healthz PASS.")
          print("No authentication, producer or real data checked; PRODUCTION NO-GO.")
          PY

  r150-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated TEST repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify migrated exact R150 source; no further patching
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object the_lab_app.py)" = "ca07e9f135328c5c7e4aa1c4a5be9711a53cd714"
          echo "6db176875fdc6b60b9ce437aae2046774bca9495f2864005f4c45d61f355ca73  the_lab_app.py" | sha256sum --check
          python -m py_compile the_lab_app.py
          echo "R150 exact immutable TEST source verified. No writes."
