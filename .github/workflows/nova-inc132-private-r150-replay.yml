name: INC132 private authorized lossless R150 replay (TEST only)

on:
  push:
    branches: [fix/neon-report-egress-r196999]
    paths:
      - .github/workflows/nova-inc132-private-r150-replay.yml
      - qa/nova_test_lab/run_inc132_private_r150_lossless_replay.py
      - qa/nova_test_lab/probe_inc132_neon_egress.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inc132-private-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorized-private-r150:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOVA_TEST_LAB_DATABASE_URL: ${{ secrets.NOVA_TEST_LAB_DATABASE_URL }}
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      ICU_API_KEY: ""
      ICU_ATHLETE_ID: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
      THE_LAB_TEST_LAB_MODE: "1"
      PRODUCT_SECURITY_STRICT: "0"
      SESSION_COOKIE_SECURE: "0"
    steps:
      - name: Checkout TEST only, no credentials retained
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify pinned R150 and install real app dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "6db176875fdc6b60b9ce437aae2046774bca9495f2864005f4c45d61f355ca73  the_lab_app.py" | sha256sum --check
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Diagnose only sanitized secret endpoint and TEST TCP egress
        run: python qa/nova_test_lab/probe_inc132_neon_egress.py
      - name: Replay two pinned active authorized lossless LAB fixtures through real R150
        shell: bash
        run: |
          set -euo pipefail
          python qa/nova_test_lab/run_inc132_private_r150_lossless_replay.py
      - name: Report explicit scope, not production clearance
        if: always()
        run: |
          echo "Never uploads raw fixtures, private artifacts, traces, or personal training data."
          echo "No Snapshot, calendar/ledger writes, or live provider calls."
          echo "Recorded JSON replay does not authenticate raw FIT bytes or owner-signed issuer."
          echo "Card3 and Card2 release gate Q01-Q24 NOT VERIFIED. PRODUCTION NO-GO."
