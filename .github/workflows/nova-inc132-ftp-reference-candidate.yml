name: INC132 Intervals FTP reference candidate (TEST only)

on:
  push:
    branches: [fix/neon-report-egress-r196999]
    paths:
      - .github/workflows/nova-inc132-ftp-reference-candidate.yml
      - qa/nova_test_lab/build_inc132_ftp_reference_candidate.py
      - qa/nova_test_lab/run_inc132_ftp_reference_candidate.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inc132-ftp-reference-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ftp-reference-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      DATABASE_URL: ""
      THE_LAB_OWNER_DATABASE_URL: ""
      NOVA_TEST_LAB_DATABASE_URL: ""
      ICU_API_KEY: ""
      ICU_ATHLETE_ID: ""
      GARMIN_EMAIL: ""
      GARMIN_PASSWORD: ""
      ANTHROPIC_API_KEY: ""
      THE_LAB_STANDARD_AI_API_KEY: ""
      THE_LAB_PLATFORM_AI_API_KEY: ""
      PRODUCT_SECURITY_STRICT: "0"
      SESSION_COOKIE_SECURE: "0"
      THE_LAB_TEST_LAB_MODE: "1"
    steps:
      - name: Checkout TEST only, no credentials retained
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install actual application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify baseline and run original R150 numeric safety regression
        shell: bash
        run: |
          set -euo pipefail
          echo "6db176875fdc6b60b9ce437aae2046774bca9495f2864005f4c45d61f355ca73  the_lab_app.py" | sha256sum -c
          python qa/nova_test_lab/run_inc132_phase4_science_split_probe.py
      - name: Build isolated candidate and prove science AST did not change
        shell: bash
        run: |
          set -euo pipefail
          python qa/nova_test_lab/build_inc132_ftp_reference_candidate.py the_lab_app.py /tmp/inc132-ftp-reference/the_lab_app.py
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          baseline = subprocess.check_output(["git", "show", "HEAD:the_lab_app.py"]).decode()
          candidate = Path("/tmp/inc132-ftp-reference/the_lab_app.py").read_text()
          before = ast.parse(baseline)
          after = ast.parse(candidate)
          guarded = (
              "_v1943_band", "_nova_inc083_science_replay",
              "_nova_inc091_compile_native", "_nova_inc091_truth",
              "build_nova_prescription", "compile_nova_prescription",
              "_nova_r196956_build_offer", "_nova_inc050_future_quality",
          )
          for name in guarded:
              def last(tree):
                  matches = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == name]
                  assert matches, name
                  return ast.dump(matches[-1], include_attributes=False)
              assert last(before) == last(after), "SCIENCE_OR_AUTHORITY_CHANGED: " + name
          print("INC132 GUARDED SOURCE AST IDENTICAL / TEST CANDIDATE ONLY")
          PY
      - name: Test real candidate Jinja and inert Flask, with original science fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/inc132-ftp-reference/the_lab_app.py the_lab_app.py
          python -m py_compile the_lab_app.py
          python qa/nova_test_lab/run_inc132_ftp_reference_candidate.py
          git diff --check -- the_lab_app.py
      - name: Explain incomplete release gates
        if: always()
        run: |
          echo "No CI secret, no database, no provider, no Snapshot, no deploy, no production writes."
          echo "R151 is ephemeral and presentation-only. R150 remains the committed source."
          echo "Native Intervals owner-bound acquisition, raw FIT receipts and Q01-Q24 not verified."
          echo "PRODUCTION NO-GO."
